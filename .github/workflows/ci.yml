name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio build twine

    - name: Run test suite
      run: |
        python -m pytest

  build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build twine

    - name: Build distribution packages
      run: |
        python -m build

    - name: Validate distribution packages with Twine
      run: |
        python -m twine check dist/*

    - name: Verify package contains no credentials or tokens
      run: |
        python -c "
        import tarfile, zipfile, glob, sys
        for f in glob.glob('dist/*.tar.gz'):
            with tarfile.open(f, 'r:gz') as tar:
                names = tar.getnames()
                for n in names:
                    if any(secret in n.lower() for secret in ['credential', 'token.json', '.key', '.env', '.db']):
                        print(f'SECURITY VIOLATION in sdist: {n}', file=sys.stderr)
                        sys.exit(1)
        for f in glob.glob('dist/*.whl'):
            with zipfile.ZipFile(f, 'r') as z:
                names = z.namelist()
                for n in names:
                    if any(secret in n.lower() for secret in ['credential', 'token.json', '.key', '.env', '.db']):
                        print(f'SECURITY VIOLATION in wheel: {n}', file=sys.stderr)
                        sys.exit(1)
        print('Security audit passed: No sensitive files in built artifacts.')
        "
