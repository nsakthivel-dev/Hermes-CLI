name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-and-test:
    name: Build distribution and test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio build twine

    - name: Run test suite
      run: |
        python -m pytest

    - name: Build wheel and source distribution
      run: |
        python -m build

    - name: Validate distribution packages with Twine
      run: |
        python -m twine check dist/*

    - name: Verify package contains no credentials or tokens
      run: |
        python -c "
        import tarfile, zipfile, glob, sys
        for f in glob.glob('dist/*.tar.gz'):
            with tarfile.open(f, 'r:gz') as tar:
                names = tar.getnames()
                for n in names:
                    if any(secret in n.lower() for secret in ['credential', 'token.json', '.key', '.env', '.db']):
                        print(f'SECURITY VIOLATION in sdist: {n}', file=sys.stderr)
                        sys.exit(1)
        for f in glob.glob('dist/*.whl'):
            with zipfile.ZipFile(f, 'r') as z:
                names = z.namelist()
                for n in names:
                    if any(secret in n.lower() for secret in ['credential', 'token.json', '.key', '.env', '.db']):
                        print(f'SECURITY VIOLATION in wheel: {n}', file=sys.stderr)
                        sys.exit(1)
        print('Security audit passed: Clean distribution verified.')
        "

    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish to PyPI via Trusted Publishing (OIDC)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-cli
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
